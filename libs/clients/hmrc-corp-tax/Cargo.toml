[package]
name = "hmrc-corp-tax"
version = "0.1.0"
edition = "2024"

[dependencies]
# async, web
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true, features = ["json"] }
# formats, serde
serde = { workspace = true, features = ["derive"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
chrono = { workspace = true, features = ["serde"] }
base64.workspace = true
# errors, logs
snafu.workspace = true
log = "0.4"
# crypto / xml
sha1 = "^0.11"
bergshamra-c14n = "0.8.0"
uppsala = "0.9"
# internal (shared leaves + the companies-house config type)
ixbrl-ir = { path = "../../ixbrl-ir" }
companies-house = { path = "../companies-house" }
