[package]
name = "ct600"
version = "0.1.0"
edition = "2024"

[features]
# Live Companies House API integration tests (in `src/companies_house.rs`,
# the `live_tests` module).  Off by default so `cargo test` runs fully
# offline on a fresh clone; enable with
# `cargo test -p ct600 --features api_tests` to run the tests that hit
# the real (or sandbox) API (needs a key + `COMPANY_NUMBER`).
api_tests = []

[dependencies]
# async, web
tokio = { workspace = true, features = ["full"] }
futures.workspace = true
reqwest = { workspace = true, features = ["json", "multipart"] }
# formats, serde
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9"
quick-xml = { version = "0.41.0", features = ["serialize"] }
serde_with = "3.21.0"
chrono = { workspace = true, features = ["serde"] }
base64.workspace = true
url = "2.5"
uuid = { workspace = true, features = ["v4"] }
# errors, logs
anyhow.workspace = true
snafu.workspace = true
log = "0.4"
env_logger = "0.11.11"
# crypto
sha1 = "^0.11"
bergshamra-c14n = "0.7"
uppsala = "0.9"
# internal
ixbrl = { path = "../ixbrl" }

[dev-dependencies]
tempfile = "3.27.0"
