[package]
name = "ct600"
version = "0.1.0"
edition = "2024"

[features]
# Live Companies House API integration tests (in `src/companies_house.rs`,
# the `live_tests` module).  `cached_live_tests` (the default) runs them
# against the repository's `.cache/api_responses`: the first, cold run
# fetches from the real (or sandbox) API and warms it, repeat runs are
# served from disk and never touch the API.  Enabling `always_live_tests`
# instead uses a scratch
# tempdir cache so every run really hits the network (e.g. to refresh the
# cache or re-validate against the API).  Disable both with
# `cargo test -p ct600 --no-default-features` to run fully offline — the
# live tests are then reported as ignored.
default = ["cached_live_tests"]
cached_live_tests = []
always_live_tests = []

[dependencies]
# async, web
tokio = { workspace = true, features = ["full"] }
# formats, serde
serde = { workspace = true, features = ["derive"] }
chrono = { workspace = true, features = ["serde"] }
base64.workspace = true
# internal
reports = { path = "../reports" }
companies-house = { path = "../clients/companies-house" }
hmrc-corp-tax = { path = "../clients/hmrc-corp-tax" }

[dev-dependencies]
tempfile = "3.27.0"
# Building ad-hoc ledgers (e.g. the loss-only book behind the ctm03955-marginal-relief
# loss-company message) needs the `Num` value type; already in the lock via
# the reports crate's rucash dependency.
rucash.workspace = true
# Shared repo-root resolution + fixtures for the test suite.
test_utils = { path = "../test_utils" }
