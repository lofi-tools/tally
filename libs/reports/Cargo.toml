[package]
name = "reports"
version = "0.1.0"
edition = "2024"

[dependencies]
rucash = { workspace = true, features = ["xml", "sqlite", "decimal"] }
serde.workspace = true
chrono.workspace = true
snafu.workspace = true
tokio.workspace = true
quick-xml = "0.41.0"
# shared leaves: the company/accounting-period model and the iXBRL IR
core_model = { path = "../core_model" }
ixbrl-ir = { path = "../ixbrl-ir" }

[dev-dependencies]
tokio = { workspace = true }
# JSONC config parsing for the example-data config files (comments allowed).
serde_json_lenient.workspace = true
# Gzip for the committed example books (ctm03955-marginal-relief/input.gnucash is a gzip of
# GnucashBook::to_gnucash_xml()); already in the lock via rucash's xml feature.
flate2 = "1"
# Shared repo-root resolution + fixtures for the test suite.
test_utils = { path = "../test_utils" }
