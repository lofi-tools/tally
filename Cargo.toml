[workspace]
members = [
  "apps/*",
  "libs/*",
  # the external-service API clients live under libs/clients (the container
  # directory itself is excluded below, so its crates are listed explicitly)
  "libs/clients/companies-house",
  "libs/clients/hmrc-corp-tax",
  # shared leaf crates (moved out of the reports crate so the clients can be leaves)
  "libs/core_model",
  "libs/ixbrl-ir",
  "apps/tally-api/tests-common",
]
# JS-only packages that live under apps/* but are not Cargo crates
# (cargo requires every workspace-member glob match to be a crate), plus the
# libs/clients container directory (its crates are listed as members above).
exclude = ["apps/design-system-showcase", "apps/tally-web", "libs/clients"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "^1.53", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
serde_json_lenient = "0.2.4"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = { version = "^1.0" }
thiserror = { version = "^1.0" }
snafu = { version = "^0.8" }
async-trait = { version = "0.1.92" }
uuid = { version = "^1.24", features = ["serde", "v4"] }
base64 = { version = "0.23.1" }
futures = { version = "^0.3" }
rucash = { version = "0.7" }
axum = { version = "0.8.9", features = ["multipart"] }
toasty = { version = "^0.10", features = [
  "postgresql",
  "serde",
  "rust_decimal",
] }
tower = "0.5"
tower-http = { version = "0.7.0", features = [
  "cors",
  "trace",
  "catch-panic",
  "request-id",
  "limit",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
argon2 = "0.5"
rand = "^0.10"
sha2 = "^0.11"
hex = "0.4"
mime = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
zip = { version = "9.0.0-pre3", default-features = false, features = [
  "deflate",
] }
rust_decimal = "^1.42"
tempfile = "3.27"

# toasty's never-built sqlite dev-driver would pull a rusqlite incompatible
# with rucash's (libsqlite3-sys links conflict); we use only the postgresql
# driver, so patch the sqlite driver to a resolution-only stub (see
# vendor/toasty-driver-sqlite).
[patch.crates-io]
toasty-driver-sqlite = { path = "vendor/toasty-driver-sqlite" }
