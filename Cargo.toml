[package]
name = "accounting"
version = "0.1.0"
edition = "2021"

[dependencies]

# async, web
tokio = { version="1.27.0", features=["full"] }
reqwest = { version = "0.11.16", features=["json"] }
# codecs, formats
serde = { version="1.0.159", features=["derive"] }
serde_json = "1.0.95"
chrono = { version="0.4.24", features=["serde"] }
# config, errors
lazy_static = "1.4.0"
anyhow = "1.0.70"
async-trait = "0.1.68"
backtrace = "0.3.67"
rand = "0.8.5"
futures = "0.3.28"
rust_decimal = "1.29.1"
# own libs
file-cache = { git="ssh+git://git@github.com/nmrshll/rust-libs" }
[patch.'ssh://git@github.com/nmrshll/rust-libs']
file-cache = { path = "../rust-libs/file-cache" }


