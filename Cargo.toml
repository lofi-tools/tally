[workspace]
members = ["apps/*", "libs/*"]
# JS-only packages that live under apps/* but are not Cargo crates
# (cargo requires every workspace-member glob match to be a crate).
exclude = ["apps/design-system-showcase", "apps/tally-web"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "^1.53", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
serde_json_lenient = "0.2.4"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = { version = "^1.0" }
thiserror = { version = "^1.0" }
snafu = { version = "^0.8" }
async-trait = { version = "0.1.92" }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
base64 = { version = "0.23.1" }
futures = { version = "^0.3" }
rucash = { version = "0.7" }
axum = { version = "0.8.9", features = ["multipart"] }
toasty = { version = "0.9.0", features = ["postgresql", "serde", "rust_decimal"] }
tower = "0.5"
tower-http = { version = "0.7.0", features = ["cors", "trace", "catch-panic", "request-id", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
mime = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rust_decimal = "1.36"
tempfile = "3.27"

# toasty's never-built sqlite dev-driver would pull a rusqlite incompatible
# with rucash's (libsqlite3-sys links conflict); we use only the postgresql
# driver, so patch the sqlite driver to a resolution-only stub (see
# vendor/toasty-driver-sqlite).
[patch.crates-io]
toasty-driver-sqlite = { path = "vendor/toasty-driver-sqlite" }
