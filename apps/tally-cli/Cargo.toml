[package]
name = "tally-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tally"
path = "src/main.rs"

[features]
# Live Companies House enrichment integration test (in `src/config.rs`, the
# `live_tests` module).  Enabled by default so `cargo test` exercises the
# real (or sandbox) API (needs a key + `COMPANY_NUMBER` +
# `COMPANY_UNIQUE_TAXPAYER_REF`); disable with `cargo test -p tally-cli
# --no-default-features` to run fully offline — the live test is then
# reported as ignored.
default = ["api_tests"]
api_tests = []

[dependencies]
# async
tokio = { workspace = true, features = ["full"] }
# formats, serde
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono = { workspace = true, features = ["serde"] }
# errors
anyhow.workspace = true
# internal
# default-features = false: ct600's only feature is `api_tests` (live
# Companies House integration tests, a default of ct600 itself).  Kept off
# here so `cargo test --workspace --no-default-features` runs fully offline
# — otherwise this dependency would re-activate ct600's default features
# during workspace feature unification.
ct600 = { path = "../../libs/ct600", default-features = false }
ixbrl = { path = "../../libs/ixbrl" }

[dev-dependencies]
tempfile = "3.27.0"
