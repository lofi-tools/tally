[package]
name = "tally-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tally"
path = "src/main.rs"

[dependencies]
# async
tokio = { workspace = true, features = ["full"] }
# formats, serde
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono = { workspace = true, features = ["serde"] }
# errors
anyhow.workspace = true
# internal
ct600 = { path = "../../libs/ct600" }
ixbrl = { path = "../../libs/ixbrl" }
