<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tally — UK company accounts and CT600 filing."
    />
    <title>Tally</title>
    <script>
      // Apply the persisted color mode before first paint so the page never
      // flashes the wrong theme. Dark is the Tally identity — only an
      // explicit stored 'light' choice opts out.
      ;(function () {
        try {
          var stored = localStorage.getItem('tally-color-mode')
          document.documentElement.classList.toggle('dark', stored !== 'light')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
