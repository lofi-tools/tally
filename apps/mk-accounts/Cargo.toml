[package]
name = "accounting"
version = "0.1.0"
edition = "2024"

[dependencies]
# async, web
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true, features = ["json", "query"] }
futures.workspace = true
hyper = { version = "1.10.1", features = ["full"] }
http = "1.4.2"
http-body-util = "0.1.4"
hyper-util = { version = "0.1.20", features = ["tokio"] }
# codecs, formats
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono = { workspace = true, features = ["serde"] }
rust_decimal = { version = "^1.35", features = ["maths"] }
num-traits = "^0.2"
# config, errors
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
backtrace = "0.3.76"
rand = "^0.8"
# own libs
file-cache = { git = "ssh+git://git@github.com/nmrshll/rust-libs" }
uuid = { workspace = true, features = ["v4"] }
url = "2.5.8"
urlencoding = "2.1.3"
base64.workspace = true
# serde_urlencoded = "0.7.1"

# api-client-utils = { git="ssh+git://git@github.com/nmrshll/rust-libs" }
# num-traits = "0.2.19"
[patch.'ssh://git@github.com/nmrshll/rust-libs']
file-cache = { path = "../rust-libs/file-cache" }
