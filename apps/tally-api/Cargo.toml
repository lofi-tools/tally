[package]
name = "tally-api"
version = "0.1.0"
edition = "2024"

# Integration tests against a real Postgres are compiled behind the
# `pg-tests` feature, on by default.  First-clone / DB-less runs use
# `cargo test -p tally-api --no-default-features` (the pg-gated tests are
# then reported as ignored), matching the workspace's offline convention
# (tally-cli's `api_tests`, ct600's `cached_live_tests` / `always_live_tests`).
[features]
default = ["pg-tests"]
pg-tests = []

[dependencies]
# async, http
tokio = { workspace = true, features = ["full"] }
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
# the `http_body::Body` trait for the request-body recorder in src/lib.rs
# (axum re-exports it as `axum::body::HttpBody`, but the impl needs the crate)
http-body = "1"
# ORM / db
toasty.workspace = true
# toasty's postgres driver + SQL serializer, wrapped in src/db_log.rs so a
# failed DB request logs at ERROR with the whole evaluated request (the stock
# driver only surfaces queries at DEBUG via its `toasty::query` event).
toasty-core = "0.9.0"
toasty-sql = "0.9.0"
toasty-driver-postgresql = "0.9.0"
async-trait.workspace = true
# formats, serde
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono = { workspace = true, features = ["serde"] }
rust_decimal.workspace = true
# errors, logs
anyhow.workspace = true
snafu.workspace = true
# tracing's `log` feature forwards tracing events to the `log` facade, which
# logforth (below) sinks — that's how the existing tracing::* calls become
# logforth records (src/otel.rs). `log-always` is required because plain
# `log` suppresses the emission while a tracing subscriber is set (it assumes
# the subscriber renders events itself), and ours (Registry + fastrace layer)
# doesn't render logs.
tracing = { workspace = true, features = ["log", "log-always"] }
tracing-subscriber.workspace = true
# observability (src/otel.rs): fastrace spans exported to OTel (Traceway) via
# fastrace-opentelemetry, fastrace-tracing as the tokio-tracing ↔ fastrace
# compatibility layer, logforth for log output.
fastrace = { version = "0.7", features = ["enable"] }
fastrace-tracing = "0.1"
fastrace-opentelemetry = "0.18"
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "logs", "http-proto", "reqwest-blocking-client"] }
logforth = { version = "0.30", features = ["starter-log", "diagnostic-fastrace"] }
# auth
argon2.workspace = true
rand.workspace = true
# argon2's `rand_core::OsRng` is cfg'd out unless the `getrandom` feature
# is enabled on the shared 0.6.x build (password-hash does not enable it).
rand_core = { version = "0.6", features = ["getrandom"] }
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
# embedding committed migration SQL files into the binary (src/migrations.rs)
include_dir = "0.7"
# web client (Companies House search adapter)
reqwest.workspace = true
# durable job worker: CancellationToken for graceful shutdown (src/jobs.rs)
tokio-util = { workspace = true, features = ["rt"] }
# CH iXBRL documents arrive zipped (src/filings.rs)
zip.workspace = true
# internal
ixbrl = { path = "../../libs/ixbrl" }
# default-features = false: ct600's only features are `cached_live_tests` /
# `always_live_tests` (live Companies House integration tests).  Kept off so
# `cargo test --workspace --no-default-features` runs fully offline.
ct600 = { path = "../../libs/ct600", default-features = false }

# Used in src/ledgers.rs (temp-file streaming for uploads), not just tests.
tempfile.workspace = true

[dev-dependencies]
# Test-only database administration (create/drop per-test databases).
tokio-postgres = "0.7"
# The shared integration-test harness (see tests-common/src/lib.rs for why a
# separate lib: pub items are never dead code, and dev-deps aren't compiled
# by `cargo build`).
tally-tests-common = { path = "tests-common" }
